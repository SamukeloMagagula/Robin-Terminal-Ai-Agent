name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a
# run against a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Robin is developed on Windows but the tool guards (path resolution,
        # symlinks, the read-only command allowlist) behave differently on
        # POSIX, so both are exercised. Node 20 is the floor we support in
        # practice; 22 is what most users will actually have.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve new versions, which is the thing the exact pins exist to stop.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The published binary is dist/cli.js; a build that typechecks but
      # produces something that cannot even be loaded is still broken.
      - name: Smoke-check the built CLI
        run: node dist/cli.js --help
